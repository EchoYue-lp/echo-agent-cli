[package]
name = "echo-agent-eval"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Independent evaluation harness for echo-agent and echo-agent-cli"

[dependencies]
echo-agent = { version = "0.2", package = "echo_agent", path = "../../echo-agent", features = ["sqlite", "mcp", "lsp", "human-loop", "subagent", "git", "tasks", "eval", "improve"] }
echo-agent-app-core = { version = "1.0", path = "../echo-agent-app-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
