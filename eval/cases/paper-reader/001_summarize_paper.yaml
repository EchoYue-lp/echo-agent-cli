id: "paper-reader-001"
name: "论文摘要提取"
description: "Agent 应阅读论文并总结其方法论和主要发现"
domain: paper-reader
task: |
  请阅读当前目录下的论文文件（PDF 或 Markdown 格式），
  提取并总结以下要点：
  1. 论文的核心方法论（methodology）：采用了什么技术路线、模型架构或实验设计
  2. 主要发现（findings）：实验结果中最关键的结论
  3. 创新点：与已有工作相比的独特贡献
  请用中文输出结构化摘要，每个要点 2-3 句话。
success_criteria:
  all_of:
    - any_of:
        - tool_used: "read_file"
        - tool_used: "web_fetch"
        - tool_used: "pdf_fetch"
    - output_contains: "方法论"
    - output_contains: "发现"
constraints: {}
