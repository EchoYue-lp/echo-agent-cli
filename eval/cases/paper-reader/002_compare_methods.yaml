id: "paper-reader-002"
name: "两篇论文方法对比"
description: "Agent 应阅读两篇论文并对比分析其方法差异"
domain: paper-reader
task: |
  请阅读当前目录下的两篇论文文件，对比分析它们的研究方法：
  1. 分别概括每篇论文的核心方法（各 2-3 句话）
  2. 对比两者在技术路线、模型设计、数据处理方面的异同
  3. 分析各自的优势和局限性
  4. 给出综合评价：哪种方法在什么场景下更适用
  请用中文输出，使用对比表格辅助说明。
success_criteria:
  all_of:
    - tool_used: "read_file"
    - output_contains: "对比"
    - output_contains: "优势"
    - output_contains: "局限"
constraints: {}
