id: "paper-reader-003"
name: "实验结果提取"
description: "Agent 应从论文中提取关键实验结果和量化指标"
domain: paper-reader
task: |
  请阅读当前目录下的论文文件，提取所有关键实验结果：
  1. 列出论文中报告的主要量化指标（如 accuracy、F1 score、precision、recall、BLEU 等）
  2. 提取实验设置信息：数据集、基线方法、评估指标
  3. 对比论文方法与基线方法的性能差异
  4. 总结实验结论：哪些假设得到了验证，哪些被推翻
  请用中文输出，量化指标使用表格呈现。
success_criteria:
  all_of:
    - tool_used: "read_file"
    - output_contains: "accuracy"
    - output_contains: "F1"
    - output_contains: "结果"
constraints: {}
