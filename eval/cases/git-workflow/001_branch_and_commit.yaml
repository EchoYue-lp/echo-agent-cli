id: "git-workflow-001"
name: "创建功能分支并提交"
description: "Agent 应创建新分支、修改文件、提交并推送"
domain: git-workflow
task: |
  创建一个新分支 feature/add-discount，
  在 src/pricing.rs 中添加一个 calculate_discount 函数，
  提交 commit，消息为 "feat: add discount calculation"。
success_criteria:
  all_of:
    - tool_used: "shell"
    - output_contains:
        substring: "feature/add-discount"
constraints:
  max_files_changed: 1
