id: "git-workflow-003"
name: "查看 Git 日志并回滚"
description: "Agent 应查看 git log 并回滚指定的 commit"
domain: git-workflow
task: |
  查看最近 5 次 commit 的日志，
  找到消息包含 "bug" 的那次 commit，
  使用 git revert 回滚它。
success_criteria:
  all_of:
    - tool_used: "shell"
    - output_contains:
        substring: "revert"
    - output_contains:
        substring: "log"
