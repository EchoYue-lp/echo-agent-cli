id: "data-002"
name: "数据清洗"
description: "Agent 应处理缺失值和异常值"
domain: data-analysis
task: |
  加载 titanic-small.csv，执行以下清洗操作：
  1. 删除 age 列为空的行
  2. 将 gender 列标准化（male/female）
  3. 保存清洗后的数据到 cleaned.csv
  报告清洗前后的行数和缺失值统计。
project_fixture: "fixtures"
success_criteria:
  all_of:
    - tool_used: "shell"
    - output_contains: "cleaned.csv"
    - output_contains: "行数"
constraints:
  forbidden_paths:
    - "titanic-small.csv"
