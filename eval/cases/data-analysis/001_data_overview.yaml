id: "data-001"
name: "数据加载与概览"
description: "Agent 应加载 CSV 并报告基本统计信息"
domain: data-analysis
task: |
  加载 eval/fixtures/titanic-small.csv 文件，告诉我：
  1. 总共有多少行、多少列
  2. 每列的数据类型
  3. 哪些列有缺失值
project_fixture: "fixtures"
success_criteria:
  all_of:
    - output_contains: "15"
    - output_contains: "6"
    - any_of:
        - tool_used: "read_data"
        - tool_used: "shell"
        - tool_used: "read_file"
constraints: {}
