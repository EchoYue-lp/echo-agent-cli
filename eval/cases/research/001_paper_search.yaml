id: "research-001"
name: "学术论文检索"
description: "Agent 应使用多个学术数据库检索论文"
domain: research
task: |
  搜索关于 "transformer attention mechanism" 的最新论文（2023-2024年），
  使用 arxiv_search 和 semantic_scholar_search，返回至少 5 篇高引用论文的标题、作者、DOI。
success_criteria:
  all_of:
    - tool_used: "arxiv_search"
    - tool_used: "semantic_scholar_search"
    - citation_valid:
        min_citations: 5
        format: "doi"
constraints: {}
