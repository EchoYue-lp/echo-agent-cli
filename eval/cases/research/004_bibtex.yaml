id: "research-004"
name: "BibTeX 引用生成"
description: "Agent 应为检索到的论文生成 BibTeX"
domain: research
task: |
  搜索 "reinforcement learning robotics" 的 3 篇高引用论文，
  使用 bibtex_generate 为每篇生成标准 BibTeX 引用格式。
success_criteria:
  all_of:
    - tool_used: "semantic_scholar_search"
    - tool_used: "bibtex_generate"
    - output_contains: "@article"
    - output_contains: "@inproceedings"
constraints: {}
