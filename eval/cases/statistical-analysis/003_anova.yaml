id: "stats-003"
name: "单因素方差分析（ANOVA）"
description: "Agent 应对三组数据执行单因素 ANOVA 并报告 F 统计量和显著性"
domain: statistical-analysis
task: |
  使用 Python（scipy 或 statsmodels）生成三组模拟数据并执行单因素方差分析（One-way ANOVA）：
  - 组 1：均值 60，标准差 8，样本量 25
  - 组 2：均值 68，标准差 10，样本量 25
  - 组 3：均值 65，标准差 9，样本量 25
  请报告：
  1. F 统计量
  2. p 值
  3. 在显著性水平 α=0.05 下，三组均值是否存在显著差异的结论
success_criteria:
  all_of:
    - tool_used: "shell"
    - any_of:
        - output_contains: "F"
        - output_contains: "F 统计量"
        - output_contains: "F-statistic"
    - any_of:
        - output_contains: "ANOVA"
        - output_contains: "方差分析"
        - output_contains: "anova"
    - any_of:
        - output_contains: "p"
        - output_contains: "p-value"
        - output_contains: "p 值"
        - output_contains: "显著"
constraints: {}
