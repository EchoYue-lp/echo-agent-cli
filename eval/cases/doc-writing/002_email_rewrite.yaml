id: "doc-writing-002"
name: "改写邮件语气"
description: "Agent 应将非正式文本改写为专业邮件格式"
domain: doc-writing
task: |
  把以下内容改写为一封正式的客户邮件：
  "嘿，你们那个 API 又挂了，赶紧修一下，我们这边全停了。"
  要求：保持核心信息，语气专业礼貌，包含称呼和落款。
success_criteria:
  all_of:
    - output_contains:
        substring: "尊敬"
    - output_contains:
        substring: "API"
    - output_contains:
        substring: "此致"
