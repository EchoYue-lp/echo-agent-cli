id: "doc-writing-001"
name: "撰写技术设计文档"
description: "Agent 应根据需求描述生成结构化的技术设计文档"
domain: doc-writing
task: |
  根据以下需求写一份技术设计文档：
  系统需要一个用户认证模块，支持 OAuth2 和 JWT token。
  要求：包含背景、方案选型、接口设计、安全考虑。
success_criteria:
  all_of:
    - output_contains:
        substring: "接口设计"
    - output_contains:
        substring: "JWT"
constraints:
  max_files_changed: 1
