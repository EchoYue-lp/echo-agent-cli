id: "doc-writing-003"
name: "生成 API 文档"
description: "Agent 应从代码中提取函数签名并生成 API 文档"
domain: doc-writing
task: |
  读取以下 Python 函数的代码，生成 Markdown 格式的 API 文档，
  包含函数名、参数说明、返回值和用法示例。
  ```python
  def calculate_discount(price: float, rate: float = 0.1) -> float:
      """Calculate discounted price."""
      return price * (1 - rate)
  ```
success_criteria:
  all_of:
    - output_contains:
        substring: "calculate_discount"
    - output_contains:
        substring: "price"
    - output_contains:
        substring: "示例"
