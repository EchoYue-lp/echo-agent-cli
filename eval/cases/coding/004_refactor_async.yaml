id: "coding-004"
name: "重构同步为异步"
description: "Agent 应将同步函数重构为 async/await，保持测试通过"
domain: coding
task: |
  在 src/lib.rs 中添加一个新的异步函数 `pub async fn fetch_data_async(url: &str) -> Result<String, String>`。
  这个函数应该模拟 HTTP 请求（不需要真正发送请求），并在 `#[cfg(test)]` 模块中添加至少 2 个异步测试。
  确保 `cargo test` 全部通过。
project_fixture: "fixtures/rust-project"
success_criteria:
  all_of:
    - test_pass:
        command: "cargo test"
    - tool_used: "edit_file"
    - output_contains: "async"
constraints:
  max_files_changed: 2
  required_read_before_edit: true
