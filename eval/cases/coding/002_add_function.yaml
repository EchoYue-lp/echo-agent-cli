id: "coding-002"
name: "添加新函数及测试"
description: "Agent 应在 lib.rs 中添加 fibonacci 函数及至少 3 个单元测试"
domain: coding
task: |
  在 src/lib.rs 中添加 `pub fn fibonacci(n: u64) -> u64` 函数，
  并在 `#[cfg(test)]` 模块中添加至少 3 个测试用例（包括 n=0, n=1, n=10）。
  确保 `cargo test` 通过。
project_fixture: "fixtures/rust-project"
success_criteria:
  all_of:
    - test_pass:
        command: "cargo test fibonacci"
    - tool_used: "edit_file"
    - output_contains: "fibonacci"
constraints:
  max_files_changed: 2
  required_read_before_edit: true
