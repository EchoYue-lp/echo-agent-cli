id: "coding-001"
name: "修复 off-by-one bug"
description: "Agent 应定位并修复 parse_config 中的 off-by-one 错误"
domain: coding
task: |
  运行 `cargo test`，找到失败的测试用例，分析根因并修复 bug。
  不要改动函数签名，只修复逻辑错误。
project_fixture: "fixtures/rust-project"
success_criteria:
  all_of:
    - test_pass:
        command: "cargo test"
    - tool_used: "shell"
    - tool_used: "read_file"
constraints:
  max_files_changed: 2
  required_read_before_edit: true
  forbidden_paths:
    - "Cargo.toml"
