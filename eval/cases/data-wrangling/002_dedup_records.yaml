id: "data-wrangling-002"
name: "重复记录去除"
description: "Agent 应识别数据集中的重复记录并执行去重操作"
domain: data-wrangling
task: |
  加载 eval/fixtures/titanic-small.csv 文件，完成以下去重任务：
  1. 检查数据集中是否存在完全重复的行（duplicate records），报告重复行数量
  2. 如果存在完全重复的行，将其删除（dedup）
  3. 进一步检查基于 name 和 age 两列组合的重复记录，报告数量
  4. 对于部分重复的记录，保留第一条，删除后续重复项
  5. 将去重后的数据保存到 deduped.csv
  报告去重前后的总行数变化，并解释完全去重与部分去重的区别。
project_fixture: "fixtures"
success_criteria:
  all_of:
    - tool_used: "shell"
    - any_of:
        - output_contains: "重复"
        - output_contains: "duplicate"
        - output_contains: "dedup"
        - output_contains: "去重"
    - output_contains: "行数"
    - output_contains: "deduped.csv"
constraints: {}
