id: "data-wrangling-003"
name: "列类型修正与数据归一化"
description: "Agent 应修正列的数据类型并对数值列进行归一化处理"
domain: data-wrangling
task: |
  加载 eval/fixtures/titanic-small.csv 文件，完成以下类型转换与归一化任务：
  1. 检查每一列当前的数据类型（dtype），列出类型信息
  2. 将 survived 列转换为分类类型（category / bool），值为 0 和 1
  3. 将 pclass 列转换为分类类型（category），表示舱位等级
  4. 将 age 和 fare 列确保为浮点类型（float），并进行 Min-Max 归一化（normalize）到 [0, 1] 区间
  5. 将归一化后的列名改为 age_norm 和 fare_norm
  6. 将类型转换和归一化后的数据保存到 normalized.csv
  报告转换前后各列的数据类型变化，以及归一化后 age_norm 和 fare_norm 的最小值和最大值。
project_fixture: "fixtures"
success_criteria:
  all_of:
    - tool_used: "shell"
    - any_of:
        - output_contains: "类型"
        - output_contains: "type"
        - output_contains: "dtype"
    - any_of:
        - output_contains: "转换"
        - output_contains: "convert"
        - output_contains: "归一化"
        - output_contains: "normalize"
    - output_contains: "normalized.csv"
constraints: {}
