id: "paper-search-001"
name: "ArXiv 最新论文检索"
description: "Agent 应使用 arxiv_search 检索最新 LLM 论文并返回标题和关键信息"
domain: paper-search
task: |
  在 ArXiv 上搜索 2024-2025 年关于 "large language model reasoning" 的最新论文，
  列出至少 3 篇论文的标题、作者和摘要要点。
  要求使用 arxiv_search 工具进行检索。
success_criteria:
  all_of:
    - tool_used: "arxiv_search"
    - output_contains:
        substring: "arxiv"
    - output_contains:
        substring: "large language model"
constraints: {}
