id: "paper-search-002"
name: "Semantic Scholar 引用查询"
description: "Agent 应使用 semantic_scholar_search 查询论文引用次数和作者信息"
domain: paper-search
task: |
  使用 Semantic Scholar 搜索 "Attention Is All You Need" 这篇经典论文，
  查询其被引用次数、作者列表和发表年份。
  同时搜索该论文引用最多的 3 篇后续工作。
success_criteria:
  all_of:
    - tool_used: "semantic_scholar_search"
    - output_contains:
        substring: "citation"
    - output_contains:
        substring: "author"
constraints: {}
