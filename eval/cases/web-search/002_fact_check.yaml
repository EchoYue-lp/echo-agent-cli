id: "web-search-002"
name: "事实核查声明"
description: "Agent 应搜索验证一个具体的事实声明"
domain: web-search
task: |
  验证以下声明是否属实：
  "Rust 语言在 2024 年 Stack Overflow 开发者调查中是最受喜爱的编程语言。"
  搜索相关证据，给出结论和来源。
success_criteria:
  all_of:
    - tool_used: "web_search"
    - output_contains:
        substring: "Rust"
    - output_contains:
        substring: "Stack Overflow"
