# Skill trigger test cases
# Each case tests whether the correct skill is activated for a given user query.
# Format: input query -> expected skill (or "none" for no trigger)

id: "skill-trigger-batch"
name: "Skill 触发准确性批量测试"
description: "测试 11 个内置 skill 的路由准确性"
domain: skill-trigger
task: |
  以下是 50 个测试输入，每个标注了期望触发的 skill。
  这是元测试数据，不直接执行，由 /eval trigger-test 命令使用。

# ── 正向触发（应激活指定 skill）──

# evidence-medicine
triggers:
  - query: "帮我搜索骨质疏松的PubMed文献"
    expected: "evidence-medicine"
  - query: "查找髋关节置换术的临床试验"
    expected: "evidence-medicine"
  - query: "做一个关于糖尿病护理的系统综述"
    expected: "evidence-medicine"
  - query: "search clinical trials for Alzheimer's"
    expected: "evidence-medicine"

# paper-search
  - query: "帮我找 transformer 相关的最新论文"
    expected: "paper-search"
  - query: "搜索 federated learning 的学术文献"
    expected: "paper-search"
  - query: "找几篇关于 attention mechanism 的高引用论文"
    expected: "paper-search"

# paper-reader
  - query: "帮我读这篇论文 https://arxiv.org/abs/2301.00001"
    expected: "paper-reader"
  - query: "分析一下这篇论文的方法论"
    expected: "paper-reader"

# data-wrangling
  - query: "加载这个 CSV 文件看看缺失值情况"
    expected: "data-wrangling"
  - query: "帮我清洗这份 Excel 数据"
    expected: "data-wrangling"
  - query: "做个 EDA 探索性分析"
    expected: "data-wrangling"

# statistical-analysis
  - query: "对这两组数据做个 t 检验"
    expected: "statistical-analysis"
  - query: "帮我跑一个线性回归"
    expected: "statistical-analysis"
  - query: "计算 p 值和置信区间"
    expected: "statistical-analysis"

# data-visualization
  - query: "画一个柱状图"
    expected: "data-visualization"
  - query: "做一个折线图展示趋势"
    expected: "data-visualization"
  - query: "帮我可视化这份数据"
    expected: "data-visualization"

# coding
  - query: "帮我写一个快速排序算法"
    expected: "coding"
  - query: "这段代码有 bug，帮我调试一下"
    expected: "coding"
  - query: "重构这个函数"
    expected: "coding"

# git-workflow
  - query: "帮我创建一个新分支"
    expected: "git-workflow"
  - query: "合并这两个分支有冲突"
    expected: "git-workflow"
  - query: "帮我提交代码"
    expected: "git-workflow"

# doc-writing
  - query: "帮我写一份技术报告"
    expected: "doc-writing"
  - query: "撰写一份项目方案"
    expected: "doc-writing"

# translation
  - query: "把这段翻译成英文"
    expected: "translation"
  - query: "帮我翻译这份文档"
    expected: "translation"

# web-search
  - query: "上网查一下最新的 AI 新闻"
    expected: "web-search"
  - query: "帮我搜索一下这个公司的信息"
    expected: "web-search"

# ── 反向测试（不应触发任何 skill）──

  - query: "今天天气怎么样"
    expected: "none"
  - query: "1+1等于几"
    expected: "none"
  - query: "给我讲个笑话"
    expected: "none"
  - query: "水的化学式是什么"
    expected: "none"
  - query: "中国的首都是哪里"
    expected: "none"

# ── 边界测试（容易混淆的场景）──

  - query: "帮我翻译这段技术文档"
    expected: "translation"
    note: "不是 doc-writing"
  - query: "画一个折线图展示销售趋势"
    expected: "data-visualization"
    note: "不是 data-wrangling"
  - query: "搜索一下最近的医学新闻"
    expected: "web-search"
    note: "不是 evidence-medicine（用户要的是新闻，不是文献）"
  - query: "帮我写一封邮件"
    expected: "none"
    note: "邮件不是 doc-writing 的触发词"

success_criteria:
  output_contains: "skill-trigger"
constraints: {}
