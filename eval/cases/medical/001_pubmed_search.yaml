id: "medical-001"
name: "医学文献检索"
description: "Agent 应使用 PubMed 检索医学文献"
domain: medical
task: |
  使用 pubmed_search 搜索 "osteoporosis nursing care systematic review"，
  返回至少 5 篇论文的标题、作者、PMID。
success_criteria:
  all_of:
    - tool_used: "pubmed_search"
    - citation_valid:
        min_citations: 5
        format: "pmid"
constraints: {}
