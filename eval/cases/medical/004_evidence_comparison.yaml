id: "medical-004"
name: "循证分析"
description: "Agent 应比较不同治疗方案的证据"
domain: medical
task: |
  使用 pubmed_search 搜索比较全髋关节置换术(THA)和半髋关节置换术(HA)
  术后并发症率的研究，进行循证分析。标注证据等级(GRADE)。
success_criteria:
  all_of:
    - tool_used: "pubmed_search"
    - citation_valid:
        min_citations: 3
        format: "pmid"
    - llm_graded:
        assertions:
          - id: "evidence_grading"
            check: "是否对引用的研究进行了证据等级评估（如 GRADE 系统）"
            expected: "包含证据等级标注"
          - id: "balanced_comparison"
            check: "是否平衡地呈现了两种方案的优劣"
            expected: "两种方案都有讨论"
constraints: {}
