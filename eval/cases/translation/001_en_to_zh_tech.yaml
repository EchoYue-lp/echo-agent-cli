id: "translation-001"
name: "中英翻译技术文档"
description: "Agent 应将英文技术文档翻译为中文，保留术语准确性"
domain: translation
task: |
  将以下英文翻译为中文，保留技术术语的英文原文（括号标注）：
  "The microservice architecture enables independent deployment of services.
   Each service communicates via REST APIs and uses circuit breakers
   to handle failures gracefully."
success_criteria:
  all_of:
    - output_contains:
        substring: "微服务"
    - output_contains:
        substring: "REST"
    - output_contains:
        substring: "熔断"
