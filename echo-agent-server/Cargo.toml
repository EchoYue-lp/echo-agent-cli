[package]
name = "echo-agent-server"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Web server (REST + SSE + WebSocket) for Echo Agent"

[dependencies]
echo-agent-app-core = { path = "../echo-agent-app-core" }
echo-agent = { version = "0.1.4", package = "echo_agent", path = "../../echo-agent" }
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
base64 = "0.22"
thiserror = "2"
jsonwebtoken = "9.0"
governor = "0.6"
dashmap = "6"
tokio = { version = "1", features = ["full"] }
metrics = "0.22"
metrics-exporter-prometheus = "0.13"
cron = "0.12"
