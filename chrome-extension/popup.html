<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EKO Browser Bridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <strong>EKO Browser Bridge</strong>
        <span id="connection" class="status">Checking</span>
      </header>
      <section>
        <div id="title" class="title">Current tab</div>
        <div id="url" class="url"></div>
      </section>
      <p id="message" class="message"></p>
      <button id="authorize" type="button">Authorize this site and tab</button>
      <button id="revoke" class="secondary" type="button">
        Release this tab
      </button>
      <button id="developer" class="secondary" type="button">
        Enable developer mode
      </button>
      <footer>
        Only explicitly authorized tabs can be controlled. EKO does not read
        Chrome cookies or profile files.
      </footer>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
