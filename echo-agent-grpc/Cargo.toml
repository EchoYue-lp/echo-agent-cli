[package]
name = "echo-agent-grpc"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "gRPC/HTTP API for Echo Agent - language bindings"

[dependencies]
echo-agent = { version = "0.2.0", package = "echo_agent", path = "../../echo-agent" }
echo-agent-app-core = { path = "../echo-agent-app-core" }
echo-agent-server = { path = "../echo-agent-server" }
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.13", features = ["tls-webpki-roots"] }
tonic-web = "0.13"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
anyhow = "1.0"
futures = "0.3"
async-stream = "0.3"

[build-dependencies]
tonic-build = "0.13"
