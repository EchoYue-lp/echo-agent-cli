# EKO 配置文件
# 复制为 echo-agent.yaml 并根据实际情况修改

# ── 模型配置 ─────────────────────────────────────────────────────
# GUI、TUI 和 CLI 共享同一模型配置。
# api_protocol 是可选 override；省略时先识别完整 endpoint，再使用框架 provider 默认值。
# Auto 可保留 provider 根地址；完整 endpoint 会自动推断协议。
# 显式协议要求 endpoint 以上述协议后缀结尾，且两者必须匹配。
# 本地、兼容 override 或 unknown provider 可省略 auth_token；云厂商默认端点仍需要 API Key。
# CLI/TUI/GUI 会读取同一份 default_model_id。
model:
  default_model_id: "deepseek:deepseek-v4-flash"
  provider: "deepseek"        # 运行时镜像字段，由模型供应商配置同步
  name: "deepseek-v4-flash"   # 运行时镜像字段，不建议手动编辑
  max_tokens: 8192
  temperature: 0.7

model_providers:
  deepseek:
    auth_token: "your-api-key"
    base_url: "https://api.deepseek.com/chat/completions"

configured_models:
  - id: "deepseek:deepseek-v4-flash"
    display_name: "Deepseek V4 Flash"
    provider: "deepseek"
    model: "deepseek-v4-flash"
    # api_protocol: "chat_completions" # 可选 override：responses | chat_completions | anthropic
    enabled: true
    max_tokens: 8192
    temperature: 0.7

# ── Agent 配置 ─────────────────────────────────────────────────────
agent:
  name: "echo-assistant"                              # Agent 名称
  system_prompt: "You are EKO, the user's local personal AI workbench. Work as a capable, evidence-driven collaborator across software, research, data, documents, and long-running tasks. Move authorized work to a verified result while respecting the user's instructions, workspace, and control over external side effects."  # 稳定身份；详细执行合同由应用层 PromptAssembler 注入
  max_iterations: 0            # ReAct 最大迭代次数（0 = 无限制，直到任务完成或用户取消）
  enable_tools: true          # 启用工具调用
  enable_memory: true         # 启用记忆
  enable_human_in_loop: true  # 启用人工介入
  memory_path: "~/.echo-agent/memory"  # 记忆存储路径
  tool_timeout_ms: 120000     # 单次工具调用超时（毫秒）
  max_tool_output_tokens: 8000 # 单个工具结果进入模型上下文的 Token 上限
  token_limit: 0              # 0 = 使用模型上下文窗口或应用默认值
  compress_strategy: "sliding"
  compress_window: 20

# ── MCP 配置 ─────────────────────────────────────────────────────
mcp:
  # MCP 配置文件路径（支持 mcp.json）
  # 如果不指定，会按顺序搜索：
  #   ./mcp.json → ./.echo-agent/mcp.json → ~/.echo-agent/mcp.json
  # config_path: "mcp.json"

# ── IM 通道配置 ─────────────────────────────────────────────────────
channels:
  # QQ Bot 通道
  qq:
    enabled: false             # 是否启用
    app_id: ""                 # QQ Bot App ID
    client_secret: ""          # QQ Bot Client Secret

  # 飞书通道
  feishu:
    enabled: false             # 是否启用
    app_id: ""                 # 飞书 App ID
    app_secret: ""             # 飞书 App Secret
    mode: "long_poll"          # 连接模式: long_poll | webhook

  # 会话配置
  session:
    timeout_minutes: 60                    # 会话超时（分钟）
    reset_keywords:                         # 触发重置的关键词
      - "重置对话"
      - "新对话"
      - "清除记忆"
    reset_commands:                         # 触发重置的命令
      - "/reset"
      - "/clear"
      - "/new"

# ── 服务配置 ─────────────────────────────────────────────────────
server:
  host: "127.0.0.1"             # 监听地址（默认绑定 localhost，安全起见不绑定 0.0.0.0）
  port: 3000                   # 监听端口

# ── 日志配置 ─────────────────────────────────────────────────────
logging:
  level: "info"                # 日志级别: trace | debug | info | warn | error

# ── TUI 配置 ─────────────────────────────────────────────────────
tui:
  max_display_chars: 20000     # 聊天区域最大保留字符数（超出后自动裁剪旧消息）
