# Research Pipeline Definition
# Parses into a Graph workflow at runtime

name: "research"
description: "Academic research pipeline with revision loop"
version: "1.0.0"

# Pipeline configuration schema
config:
  topic:
    type: string
    required: true
  max_papers:
    type: integer
    default: 20
  max_revisions:
    type: integer
    default: 3
  quality_threshold:
    type: integer
    default: 70

# Graph nodes
nodes:
  - id: init
    type: function
    action: store_templates

  - id: search_prompt
    type: function
    action: build_prompt
    input:
      template: "{{tpl_search}}"
      variables:
        topic: "{{config.topic}}"
        max_papers: "{{config.max_papers}}"

  - id: search
    type: agent
    prompt_key: search_prompt
    output_key: search_results

  - id: merge_prompt
    type: function
    action: build_prompt
    input:
      template: "{{tpl_merge}}"
      context: "{{search_results}}"

  - id: merge
    type: agent
    prompt_key: merge_prompt
    output_key: merged_results

  - id: fetch_prompt
    type: function
    action: build_prompt
    input:
      template: "{{tpl_fetch}}"
      context: "{{merged_results}}"

  - id: fetch
    type: agent
    prompt_key: fetch_prompt
    output_key: fetched_papers

  - id: synthesize_prompt
    type: function
    action: build_prompt
    input:
      template: "{{tpl_synthesize}}"
      context: "{{fetched_papers}}"

  - id: synthesize
    type: agent
    prompt_key: synthesize_prompt
    output_key: literature_review

  - id: write_prompt
    type: function
    action: build_prompt
    input:
      template: "{{tpl_write}}"
      context: "{{literature_review}}"

  - id: write_paper
    type: agent
    prompt_key: write_prompt
    output_key: paper_draft

  - id: review_prompt
    type: function
    action: build_prompt
    input:
      template: "{{tpl_review}}"
      context: "{{paper_draft}}"
      revision_count: "{{revision_count}}"

  - id: review_paper
    type: agent
    prompt_key: review_prompt
    output_key: review_feedback

  - id: evaluate_quality
    type: function
    action: extract_quality_score

  - id: revise_prompt
    type: function
    action: build_prompt
    input:
      template: "{{tpl_revise}}"
      draft: "{{paper_draft}}"
      review: "{{review_feedback}}"

  - id: revise_paper
    type: agent
    prompt_key: revise_prompt
    output_key: paper_draft

  - id: increment_revision
    type: function
    action: increment_counter
    variable: revision_count

  - id: finalize
    type: function
    action: finalize_output

# Graph edges (flow)
edges:
  - from: init
    to: search_prompt
  - from: search_prompt
    to: search
  - from: search
    to: merge_prompt
  - from: merge_prompt
    to: merge
  - from: merge
    to: fetch_prompt
  - from: fetch_prompt
    to: fetch
  - from: fetch
    to: synthesize_prompt
  - from: synthesize_prompt
    to: synthesize
  - from: synthesize
    to: write_prompt
  - from: write_prompt
    to: write_paper
  - from: write_paper
    to: review_prompt
  - from: review_prompt
    to: review_paper
  - from: review_paper
    to: evaluate_quality
  - from: evaluate_quality
    to: finalize
    condition: "quality_score >= threshold or revision_count >= max_revisions"
  - from: evaluate_quality
    to: revise_prompt
    condition: "quality_score < threshold and revision_count < max_revisions"
  - from: revise_prompt
    to: revise_paper
  - from: revise_paper
    to: increment_revision
  - from: increment_revision
    to: review_prompt

# Prompt templates
templates:
  tpl_search: |
    Search for the top {max_papers} academic papers about: {topic}
    For each paper found, extract:
    - Title
    - Authors
    - Year of publication
    - Abstract or key findings
    - Paper ID (arxiv ID or DOI if available)
    - Citation count if available

    Cover both ArXiv and Semantic Scholar sources.
    Return results as structured text organized by source.

  tpl_merge: |
    Organize and merge the following search results. Remove duplicates and
    present as a unified, well-structured summary organized by relevance and topic.

  tpl_fetch: |
    Based on the following search results, identify the most relevant
    and impactful papers (up to {max_papers}). For each selected paper:
    1. Summarize the key findings and contributions
    2. Note the methodology and approach
    3. Identify how it relates to the research topic
    4. Note any limitations or gaps identified by the authors

  tpl_synthesize: |
    You are writing a comprehensive literature review on: {topic}

    Based on the following analyzed papers, write a structured literature review
    that includes:
    1. Introduction and background context
    2. Key themes and approaches in the field
    3. Comparison of methodologies across papers
    4. Major findings and contributions
    5. Identified gaps, contradictions, and future directions

    Use proper academic citations [1], [2], etc.
    Ensure each claim is grounded in the papers analyzed.

  tpl_write: |
    You are writing an academic paper on: {topic}

    Using the literature review below, write a complete paper draft with:
    1. Title
    2. Abstract (150-250 words)
    3. Introduction
    4. Related Work (based on the literature review)
    5. Methodology / Approach
    6. Analysis / Discussion
    7. Conclusion and Future Work
    8. References

    Maintain academic tone, proper citations, and logical flow.
    Ensure every citation references an actual paper from the review.

  tpl_review: |
    You are a peer reviewer evaluating an academic paper on: {topic}

    Review the following paper draft and provide:
    1. Overall quality score (0-100) -- at the very beginning of your response,
       output exactly: QUALITY_SCORE: <number>
    2. Strengths (what works well)
    3. Weaknesses (what needs improvement)
    4. Specific, actionable suggestions for each section

    Be thorough and constructive.

  tpl_revise: |
    You are a revision specialist.

    Revise the following paper draft based on the reviewer feedback.
    Address every point raised by the reviewer. Improve clarity, rigor,
    citation accuracy, and overall quality.

    Provide the complete revised paper with improvements.
