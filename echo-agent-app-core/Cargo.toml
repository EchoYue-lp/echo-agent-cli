[package]
name = "echo-agent-app-core"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Shared state and infrastructure for EKO"

[dependencies]
echo-agent = { version = "0.2", package = "echo_agent", path = "../../echo-agent", default-features = false, features = [
    "mcp", "lsp", "human-loop", "subagent", "git",
    "shell", "files", "web",
    "chart", "research", "media",
    "rag", "project-rules",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.49.9", default-features = false }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
ts-rs = { version = "9", features = ["chrono-impl", "serde-json-impl", "uuid-impl", "no-serde-warnings"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
thiserror = "2"
anyhow = "1.0"
base64 = "0.22"
serde_yaml = "0.9"
dashmap = "6"
portable-pty = "0.8"
config = "0.14"
notify = "7"
tokio-util = "0.7"
cron = "0.12"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
async-trait = "0.1"
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
similar = "2"
dirs = "6"
axum = { version = "0.7" }
nu-ansi-term = "0.50"
tempfile = "3"  # Sprint 10: EkoDataWorkspaceFactory per-subagent tmpdir (was dev-only)

[features]
telemetry = ["echo-agent/telemetry"]
test-utils = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("__ts_rs"))'] }

[dev-dependencies]
echo-agent = { version = "0.2", package = "echo_agent", path = "../../echo-agent", default-features = false, features = ["testing"] }
