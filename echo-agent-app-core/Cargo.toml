[package]
name = "echo-agent-app-core"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Shared state and infrastructure for EchoCoWork"

[package.metadata.ts-rs]
export_dir = "../web-frontend/src/generated"

[dependencies]
echo-agent = { version = "0.2", package = "echo_agent", path = "../../echo-agent", features = ["sqlite", "mcp", "human-loop", "subagent", "git", "tasks"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
ts-rs = { version = "9", features = ["chrono-impl", "serde-json-impl", "uuid-impl"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
thiserror = "2"
anyhow = "1.0"
base64 = "0.22"
serde_yaml = "0.9"
dashmap = "6"
config = "0.14"
notify = "7"
tokio-util = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
cron = "0.12"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
similar = "2"
dirs = "6"
axum = { version = "0.7" }
nu-ansi-term = "0.50"
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig", "default-syntaxes", "default-themes"] }
pulldown-cmark = "0.11"
indicatif = "0.17"
terminal_size = "0.3"

[features]
telemetry = ["echo-agent/telemetry"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("__ts_rs"))'] }

[dev-dependencies]
tempfile = "3"
