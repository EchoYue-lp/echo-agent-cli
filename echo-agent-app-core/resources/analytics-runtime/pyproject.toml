[project]
name = "eko-analytics-runtime"
version = "0.1.0"
description = "Locked Python runtime for EKO analysis workspaces"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "pyarrow>=18,<24",
    "scipy>=1.14,<2",
    "seaborn>=0.13,<1",
    "statsmodels>=0.14,<1",
]

[tool.uv]
package = false
