[workspace]
resolver = "3"
members = [
    "echo-agent-app-core",
]

[package]
name = "echo-agent-cli"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
default-run = "echo-agent-cli"
license = "MIT"
description = "EchoCoWork — Production-grade AI Agent CLI and Desktop App"
repository = "https://github.com/EchoYue-lp/echo-agent-cli"
homepage = "https://github.com/EchoYue-lp/echo-agent-cli"
readme = "README.md"
keywords = ["ai", "agent", "llm", "cli", "web"]
categories = ["command-line-utilities", "web-programming", "development-tools"]

[features]
default = ["tui"]
tui = [
    "dep:ratatui", "dep:crossterm", "dep:arboard",
    "dep:unicode-width", "dep:textwrap", "dep:strum",
    "dep:strum_macros", "dep:pulldown-cmark", "dep:syntect",
]
gui = [
    "dep:tauri", "dep:tauri-plugin-shell", "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-notification", "dep:tauri-plugin-fs",
    "dep:tauri-plugin-global-shortcut", "dep:portable-pty",
    "dep:dashmap", "dep:similar",
]
channels = ["echo-agent/channels"]
telemetry = ["echo-agent/telemetry"]
devtools = ["tauri?/devtools"]

[[bin]]
name = "echo-agent-cli"
path = "src/main.rs"
required-features = ["tui"]

[[bin]]
name = "echo-agent-tauri"
path = "src-tauri/src/main.rs"
required-features = ["gui"]

[dependencies]
echo-agent-app-core = { path = "./echo-agent-app-core" }
echo-agent = { version = "0.2.0", package = "echo_agent", path = "../echo-agent", features = ["sqlite", "mcp", "lsp", "human-loop", "subagent", "tasks", "eval", "improve"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
reedline = "0.38"
nu-ansi-term = "0.50"
crossterm = { version = "0.28", optional = true }
futures = "0.3"
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_yaml_ng = "0.10"
dotenvy = "0.15"
indicatif = "0.17"
pulldown-cmark = { version = "0.11", optional = true }
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig", "default-syntaxes", "default-themes"], optional = true }
similar = { version = "2", optional = true }
terminal_size = "0.3"
clap_complete = "4"
shellexpand = "3"
notify = "7"
parking_lot = "0.12"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
ratatui = { version = "0.29", features = ["crossterm"], optional = true }
unicode-width = { version = "0.2", optional = true }
textwrap = { version = "0.16", optional = true }
strum = { version = "0.26", optional = true }
strum_macros = { version = "0.26", optional = true }
portable-pty = { version = "0.8", optional = true }
dashmap = { version = "6", optional = true }
base64 = "0.22"
arboard = { version = "3", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }
