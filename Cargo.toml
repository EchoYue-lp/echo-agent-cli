[workspace]
resolver = "3"
members = [
    "echo-agent-app-core",
    "echo-agent-server",
    "echo-agent-grpc",
]

[package]
name = "echo-agent-cli"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
default-run = "echo-agent-cli"
license = "MIT"
description = "Multi-mode CLI + Web server for the Echo Agent AI framework"
repository = "https://github.com/EchoYue-lp/echo-agent-cli"
homepage = "https://github.com/EchoYue-lp/echo-agent-cli"
readme = "README.md"
keywords = ["ai", "agent", "llm", "cli", "web"]
categories = ["command-line-utilities", "web-programming", "development-tools"]

[features]
default = []
channels = ["echo-agent/channels"]
telemetry = ["echo-agent/telemetry"]
devtools = ["tauri/devtools"]

[[bin]]
name = "echo-agent-cli"
path = "src/main.rs"

[[bin]]
name = "echo-agent-tauri"
path = "src-tauri/src/main.rs"

[dependencies]
echo-agent-app-core = { path = "./echo-agent-app-core" }
echo-agent-server = { path = "./echo-agent-server" }
echo-agent = { version = "0.2.0", package = "echo_agent", path = "../echo-agent", features = ["sqlite", "mcp", "lsp", "human-loop", "subagent", "tasks", "eval", "improve"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
reedline = "0.38"
nu-ansi-term = "0.50"
crossterm = "0.28"
futures = "0.3"
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_yaml_ng = "0.10"
dotenvy = "0.15"
indicatif = "0.17"
pulldown-cmark = "0.11"
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig", "default-syntaxes", "default-themes"] }
similar = "2"
terminal_size = "0.3"
clap_complete = "4"
shellexpand = "3"
notify = "7"
parking_lot = "0.12"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
bcrypt = "0.16"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
ratatui = { version = "0.29", features = ["crossterm"] }
unicode-width = "0.2"
textwrap = "0.16"
strum = "0.26"
strum_macros = "0.26"
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
