[workspace]
resolver = "3"
members = [
    "echo-agent-app-core",
]

[package]
name = "echo-agent-cli"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
default-run = "echo-agent-tauri"
license = "MIT"
description = "EKO — 本地个人桌面智能助理"
repository = "https://github.com/EchoYue-lp/echo-agent-cli"
homepage = "https://github.com/EchoYue-lp/echo-agent-cli"
readme = "README.md"
keywords = ["ai", "agent", "llm", "cli", "web"]
categories = ["command-line-utilities", "web-programming", "development-tools"]

[features]
default = ["gui"]
gui = [
    "dep:tauri", "dep:tauri-plugin-shell", "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-notification", "dep:tauri-plugin-fs",
    "dep:tauri-plugin-global-shortcut",
    "dep:dashmap", "channels",
]
channels = ["echo-agent-app-core/channels"]
telemetry = ["echo-agent/telemetry"]
devtools = ["tauri?/devtools"]

[[bin]]
name = "echo-agent-tauri"
path = "src-tauri/src/main.rs"
required-features = ["gui"]

[dependencies]
echo-agent-app-core = { path = "./echo-agent-app-core" }
echo-agent = { version = "0.2.0", package = "echo_agent", path = "../echo-agent", default-features = false, features = ["mcp", "human-loop", "subagent"] }
# async_trait: needed for `impl MessageHandler for AppChannelMessageHandler` (channels feature).
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
dirs = "6"
shell-words = "1"
parking_lot = "0.12"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
dashmap = { version = "6", optional = true }
base64 = "0.22"

[dev-dependencies]
echo-agent-app-core = { path = "./echo-agent-app-core", features = ["test-utils"] }
echo-agent = { version = "0.2.0", package = "echo_agent", path = "../echo-agent", default-features = false, features = ["testing"] }
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
