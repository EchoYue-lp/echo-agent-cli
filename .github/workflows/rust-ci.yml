name: Rust CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # echo-agent-cli depends on the echo-agent framework through a local
      # path dependency (path = "../echo-agent" in the root and sub-crate
      # Cargo.toml files). CI checks this repo out on its own, so the sibling
      # directory is absent and the workspace cannot even load — every cargo
      # step (fmt/clippy/test) errors with "failed to read ../echo-agent/
      # Cargo.toml". Check out echo-agent@main into ../echo-agent to satisfy
      # the path dependency. (Requires echo-agent to be publicly readable; if
      # it is ever made private, pass a PAT with contents:read via `token:`.)
      - name: Checkout echo-agent (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: EchoYue-lp/echo-agent
          path: ../echo-agent

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo fmt check
        run: cargo fmt --all --check

      # Clippy must be as strict as the framework: -D warnings + all features,
      # so telemetry/eval/gui-gated code paths are actually linted. Previously
      # this only checked the `tui` feature (which is in `default`) and did not
      # fail on warnings — letting regressions slip through.
      - name: Cargo clippy (all features, deny warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Cargo test (all features)
        run: cargo test --workspace --all-features --locked

      # Verify the core library compiles without any optional features (the CLI
      # binary itself requires `tui` or `gui`, so we scope this to app-core).
      - name: Cargo check app-core (no-default-features)
        run: cargo check -p echo-agent-app-core --no-default-features --locked

      # Skill trigger-accuracy gate: FAILS the build when F1 drops below the
      # threshold, so a regression in trigger detection is caught here rather
      # than at runtime. Previously this step always passed (Ok(()) regardless
      # of F1), making it a no-op.
      - name: Skill trigger accuracy gate (F1 ≥ 0.7)
        run: cargo run -p echo-agent-eval -- trigger-test --threshold 0.7
