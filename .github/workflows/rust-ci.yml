name: Rust CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout echo-agent (sibling path dependency)
        uses: actions/checkout@v6
        with:
          repository: EchoYue-lp/echo-agent
          ref: f6d81fe809a9661b58e7a9aaa71b753696defbc2
          path: echo-agent
      - name: Prepare sibling path dependency
        run: ln -s "$GITHUB_WORKSPACE/echo-agent" "$GITHUB_WORKSPACE/../echo-agent"
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo clippy --workspace --lib --bins --all-features --locked -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::unreachable
          cargo test --workspace --all-features --locked
          cargo check -p echo-agent-app-core --no-default-features --locked
      - name: Verify GUI feature matrix
        run: |
          cargo check --no-default-features --features gui --bin echo-agent-tauri
          cargo test --no-default-features --features gui
      - name: Verify generated frontend contracts are current
        run: git diff --exit-code -- web-frontend/src/generated

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: web-frontend
        run: npm ci
      - name: Verify frontend formatting
        working-directory: web-frontend
        run: npx prettier --check "src/**/*.{ts,tsx}"
      - name: Test frontend
        working-directory: web-frontend
        run: npm test
      - name: Build frontend
        working-directory: web-frontend
        run: npm run build
