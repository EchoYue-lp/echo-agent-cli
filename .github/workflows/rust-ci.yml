name: Rust CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The task branch must pass the exhaustive local Rust, GUI, and frontend gates
# before merge. CI keeps a bounded Linux build/test signal and an independent
# Node LTS frontend run that compiles the checked-in TypeScript contracts.
jobs:
  # Lint and tests compile different feature sets. Give each its own bounded
  # runner budget so cold lint/check work cannot consume the test deadline.
  linux-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - name: Checkout echo-agent (sibling path dependency)
        uses: actions/checkout@v6
        with:
          repository: EchoYue-lp/echo-agent
          # Framework changes merge first, so the application always validates
          # against the current public framework surface.
          ref: main
          path: echo-agent
      - name: Prepare sibling path dependency
        run: ln -s "$GITHUB_WORKSPACE/echo-agent" "$GITHUB_WORKSPACE/../echo-agent"
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Check Linux workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo check -p echo-agent-app-core --no-default-features --locked

  linux-app-core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - name: Checkout echo-agent (sibling path dependency)
        uses: actions/checkout@v6
        with:
          repository: EchoYue-lp/echo-agent
          # Framework changes merge first, so the application always validates
          # against the current public framework surface.
          ref: main
          path: echo-agent
      - name: Prepare sibling path dependency
        run: ln -s "$GITHUB_WORKSPACE/echo-agent" "$GITHUB_WORKSPACE/../echo-agent"
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Diagnose core-test compile boundary
        timeout-minutes: 21
        env:
          TS_RS_EXPORT_DIR: ${{ runner.temp }}/ts-rs
        run: |
          set -o pipefail
          free -h
          /usr/bin/time -v timeout --signal=INT --kill-after=30s 20m \
            cargo test -p echo-agent-app-core --lib --locked --no-run \
            2>&1 | tee "$RUNNER_TEMP/core-compile.log"
      - name: Preserve temporary compile diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-compile-diagnosis
          path: ${{ runner.temp }}/core-compile.log
          if-no-files-found: warn
      - name: Diagnose all app-core tests in isolated batches
        timeout-minutes: 15
        env:
          TS_RS_EXPORT_DIR: ${{ runner.temp }}/ts-rs
        run: |
          python3 -u <<'PY_DIAG'
          import json, os, pathlib, re, subprocess, sys, time
          def run(args):
              p = subprocess.run(args, text=True, capture_output=True)
              if p.returncode:
                  print(p.stdout, flush=True)
                  print(p.stderr, flush=True)
                  raise SystemExit(p.returncode)
              return p.stdout
          data = run(["cargo", "test", "-p", "echo-agent-app-core", "--lib", "--locked", "--no-run", "--message-format=json"])
          binaries = []
          for line in data.splitlines():
              item = json.loads(line)
              if item.get("reason") == "compiler-artifact" and item.get("profile", {}).get("test") and item.get("executable"):
                  binaries.append(item["executable"])
          assert len(binaries) == 1, binaries
          binary = binaries[0]
          listing = run([binary, "--list"])
          names = [line.removesuffix(": test") for line in listing.splitlines() if line.endswith(": test")]
          assert names and len(names) == len(set(names))
          log_root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "core-test-batches"
          log_root.mkdir(exist_ok=True)
          (log_root / "test-manifest.json").write_text(json.dumps(names, indent=2))
          completed = []
          for index in range(0, len(names), 40):
              group = names[index:index+40]
              print(f"BATCH {index//40 + 1}: {len(group)} tests, {group[0]} .. {group[-1]}", flush=True)
              started = time.monotonic()
              try:
                  p = subprocess.run([binary, "--test", "--exact", "--test-threads=2", *group], text=True, capture_output=True, timeout=120)
              except subprocess.TimeoutExpired as error:
                  print(f"BATCH TIMEOUT after 120s: {group}", flush=True)
                  (log_root / f"batch-{index//40 + 1}.log").write_bytes((error.stdout or b"") + (error.stderr or b""))
                  raise SystemExit(124)
              output = p.stdout + p.stderr
              (log_root / f"batch-{index//40 + 1}.log").write_text(output)
              print(output, flush=True)
              if p.returncode:
                  raise SystemExit(p.returncode)
              summary = re.search(r"test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured;", output)
              assert summary and int(summary[1]) + int(summary[3]) == len(group), "incomplete test coverage"
              completed.extend(group)
              print(f"BATCH COMPLETE in {time.monotonic()-started:.2f}s", flush=True)
          assert completed == names
          print(f"ALL {len(names)} discovered tests covered exactly once (including harness-ignored tests).", flush=True)

          PY_DIAG
      - name: Preserve temporary test batch diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-batch-diagnosis
          path: ${{ runner.temp }}/core-test-batches
          if-no-files-found: warn

  linux-rust:
    # Preserve the existing combined required-check name. A cancelled, failed,
    # or skipped prerequisite must never produce a successful Linux gate.
    needs: [linux-quality, linux-app-core-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both Linux signals
        env:
          QUALITY_RESULT: ${{ needs['linux-quality'].result }}
          TEST_RESULT: ${{ needs['linux-app-core-tests'].result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$TEST_RESULT" != "success" ]]; then
            echo "Linux gates incomplete: quality=$QUALITY_RESULT tests=$TEST_RESULT"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: web-frontend
        run: npm ci
      - name: Verify frontend
        working-directory: web-frontend
        run: |
          npx prettier --check "src/**/*.{ts,tsx}"
          npm test
          npm run build
