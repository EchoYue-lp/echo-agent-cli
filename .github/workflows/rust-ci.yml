name: Rust CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # echo-agent-cli depends on the echo-agent framework through a local
      # path dependency (path = "../echo-agent" in the root and sub-crate
      # Cargo.toml). CI checks out this repo at
      # /home/runner/work/echo-agent-cli/echo-agent-cli, so we check out
      # echo-agent inside the workspace and symlink it to ../echo-agent to
      # satisfy the path references without escaping the workspace root
      # (actions/checkout@v4 rejects paths outside the workspace).
      - name: Checkout echo-agent (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: EchoYue-lp/echo-agent
          path: echo-agent
      - name: Symlink echo-agent to expected path
        run: ln -s $GITHUB_WORKSPACE/echo-agent $GITHUB_WORKSPACE/../echo-agent

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo fmt check
        run: cargo fmt --all --check

      # Clippy must be as strict as the framework: -D warnings + all features,
      # so telemetry/eval/gui-gated code paths are actually linted. Previously
      # this only checked the `tui` feature (which is in `default`) and did not
      # fail on warnings — letting regressions slip through.
      - name: Cargo clippy (all features, deny warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # Security gate: detect patterns that the AGENTS.md hard constraints forbid.
      # Fail the build when .expect(), unreachable!(), or byte-slicing (instead of
      # chars().take()) appears in production code (P3-6.5).
      - name: Security pattern gate
        run: |
          set -e
          DIRS="echo-agent-cli/src echo-agent-cli/echo-agent-app-core/src echo-agent/src echo-agent/echo-core/src echo-agent/echo-execution/src echo-agent/echo-orchestration/src echo-agent/echo-state/src echo-agent/echo-tools/src echo-agent/echo-integration/src"
          # .expect() calls (should use proper error propagation)
          if grep -rn '\.expect(' $DIRS --include='*.rs' | grep -v '/tests/' | grep -v '/examples/' | grep -v '#\[cfg(test)\]' | grep -v '\.lock().unwrap_or_else' | grep -v '/target/' ; then
            echo "ERROR: .expect() calls found in production code"
            exit 1
          fi
          # unreachable!() in production code
          if grep -rn 'unreachable!(' $DIRS --include='*.rs' | grep -v '/tests/' | grep -v '/examples/' | grep -v '/target/' ; then
            echo "ERROR: unreachable!() found in production code"
            exit 1
          fi
          echo "Security pattern gate passed"

      - name: Cargo test (all features)
        run: cargo test --workspace --all-features --locked

      # Verify the core library compiles without any optional features (the CLI
      # binary itself requires `tui` or `gui`, so we scope this to app-core).
      - name: Cargo check app-core (no-default-features)
        run: cargo check -p echo-agent-app-core --no-default-features --locked
