name: Rust CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo fmt check
        run: cargo fmt --all --check

      # Clippy must be as strict as the framework: -D warnings + all features,
      # so telemetry/eval/gui-gated code paths are actually linted. Previously
      # this only checked the `tui` feature (which is in `default`) and did not
      # fail on warnings — letting regressions slip through.
      - name: Cargo clippy (all features, deny warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Cargo test (all features)
        run: cargo test --workspace --all-features --locked

      # Verify the core library compiles without any optional features (the CLI
      # binary itself requires `tui` or `gui`, so we scope this to app-core).
      - name: Cargo check app-core (no-default-features)
        run: cargo check -p echo-agent-app-core --no-default-features --locked

      # Skill trigger-accuracy gate: FAILS the build when F1 drops below the
      # threshold, so a regression in trigger detection is caught here rather
      # than at runtime. Previously this step always passed (Ok(()) regardless
      # of F1), making it a no-op.
      - name: Skill trigger accuracy gate (F1 ≥ 0.7)
        run: cargo run -p echo-agent-eval -- trigger-test --threshold 0.7
