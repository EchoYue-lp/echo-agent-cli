name: Rust CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The task branch must pass the exhaustive local Rust, GUI, and frontend gates
# before merge. CI keeps a bounded Linux build/test signal and an independent
# Node LTS frontend run that compiles the checked-in TypeScript contracts.
jobs:
  linux-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - name: Checkout echo-agent (sibling path dependency)
        uses: actions/checkout@v6
        with:
          repository: EchoYue-lp/echo-agent
          # Framework changes merge first, so the application always validates
          # against the current public framework surface.
          ref: main
          path: echo-agent
      - name: Prepare sibling path dependency
        run: ln -s "$GITHUB_WORKSPACE/echo-agent" "$GITHUB_WORKSPACE/../echo-agent"
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Check Linux workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo check -p echo-agent-app-core --no-default-features --locked
      - name: Test application core on Linux
        env:
          # ts-rs export tests must not overwrite the checked-in bindings. Some
          # cross-crate wire types need curated imports that ts-rs 9 cannot infer.
          TS_RS_EXPORT_DIR: ${{ runner.temp }}/ts-rs
        run: cargo test -p echo-agent-app-core --lib --locked

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: web-frontend
        run: npm ci
      - name: Verify frontend
        working-directory: web-frontend
        run: |
          npx prettier --check "src/**/*.{ts,tsx}"
          npm test
          npm run build
