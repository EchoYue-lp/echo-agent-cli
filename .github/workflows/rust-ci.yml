name: Rust CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The task branch must pass the exhaustive local Rust, GUI, and frontend gates
# before merge. CI keeps a bounded Linux build/test signal and an independent
# Node LTS frontend run that compiles the checked-in TypeScript contracts.
jobs:
  # Lint and tests compile different feature sets. Give each its own bounded
  # runner budget so cold lint/check work cannot consume the test deadline.
  linux-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - name: Checkout echo-agent (sibling path dependency)
        uses: actions/checkout@v6
        with:
          repository: EchoYue-lp/echo-agent
          # Framework changes merge first, so the application always validates
          # against the current public framework surface.
          ref: main
          path: echo-agent
      - name: Prepare sibling path dependency
        run: ln -s "$GITHUB_WORKSPACE/echo-agent" "$GITHUB_WORKSPACE/../echo-agent"
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Check Linux workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo check -p echo-agent-app-core --no-default-features --locked

  linux-app-core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - name: Checkout echo-agent (sibling path dependency)
        uses: actions/checkout@v6
        with:
          repository: EchoYue-lp/echo-agent
          # Framework changes merge first, so the application always validates
          # against the current public framework surface.
          ref: main
          path: echo-agent
      - name: Prepare sibling path dependency
        run: ln -s "$GITHUB_WORKSPACE/echo-agent" "$GITHUB_WORKSPACE/../echo-agent"
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Diagnose core-test compile boundary
        timeout-minutes: 21
        env:
          TS_RS_EXPORT_DIR: ${{ runner.temp }}/ts-rs
        run: |
          set -o pipefail
          free -h
          /usr/bin/time -v timeout --signal=INT --kill-after=30s 20m \
            cargo test -p echo-agent-app-core --lib --locked --no-run \
            2>&1 | tee "$RUNNER_TEMP/core-compile.log"
      - name: Preserve temporary compile diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-compile-diagnosis
          path: ${{ runner.temp }}/core-compile.log
          if-no-files-found: warn
      - name: Prepare test manifest and diagnostic helper
        env:
          TS_RS_EXPORT_DIR: ${{ runner.temp }}/ts-rs
        run: |
          python3 -u <<'PY_PREP'
          import json, os, pathlib, subprocess
          p = subprocess.run(["cargo", "test", "-p", "echo-agent-app-core", "--lib", "--locked", "--no-run", "--message-format=json"], text=True, capture_output=True, check=True)
          executables = [item["executable"] for line in p.stdout.splitlines() if (item := json.loads(line)).get("reason") == "compiler-artifact" and item.get("profile", {}).get("test") and item.get("executable")]
          assert len(executables) == 1
          binary = executables[0]
          listing = subprocess.check_output([binary, "--list"], text=True)
          names = [line.removesuffix(": test") for line in listing.splitlines() if line.endswith(": test")]
          assert len(names) == 1603 and len(set(names)) == len(names), "diagnostic manifest changed"
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "core-test-batches"
          root.mkdir(exist_ok=True)
          (root / "manifest.json").write_text(json.dumps({"binary": binary, "names": names}, indent=2))
          print(f"Manifest preserved: {len(names)} tests", flush=True)

          PY_PREP
          cat > "$RUNNER_TEMP/diagnose-batch.py" <<'PY_BATCH'
          import json, os, pathlib, re, signal, subprocess, sys, time
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "core-test-batches"
          manifest = json.loads((root / "manifest.json").read_text())
          index = int(sys.argv[1])
          group = [manifest["names"][960+index]]
          assert group
          print(f"Batch {index+1}: {group}", flush=True)
          start = time.monotonic()
          # This diagnostic owns a fresh process group. Timeout cleanup must close
          # descendants' pipe handles so an interrupted batch can publish its evidence.
          p = subprocess.Popen([manifest["binary"], "--test", "--exact", "--test-threads=2", *group], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, start_new_session=True)
          try:
              output, _ = p.communicate(timeout=120)
          except subprocess.TimeoutExpired:
              os.killpg(p.pid, signal.SIGKILL)
              output, _ = p.communicate(timeout=10)
              (root / f"batch-{index+1:02d}.log").write_text(output)
              print(output, flush=True)
              print("BATCH TIMEOUT", flush=True)
              raise SystemExit(124)
          (root / f"batch-{index+1:02d}.log").write_text(output)
          print(output, flush=True)
          if p.returncode:
              raise SystemExit(p.returncode)
          summaries = re.findall(r"test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured;", output)
          assert summaries
          summary = summaries[-1]
          assert int(summary[0]) + int(summary[2]) == len(group), "incomplete test coverage"
          (root / f"batch-{index+1:02d}.json").write_text(json.dumps({"names": group, "passed": int(summary[0]), "ignored": int(summary[2]), "seconds": time.monotonic()-start}))
          print(f"BATCH COMPLETE in {time.monotonic()-start:.2f}s", flush=True)

          PY_BATCH
      - name: Preserve exact diagnostic test manifest
        uses: actions/upload-artifact@v4
        with:
          name: core-test-manifest
          path: ${{ runner.temp }}/core-test-batches/manifest.json
      - name: Diagnose case 01 - user_scope_adds_new_subagent
        id: case01
