          assert names == manifest["names"], "missing or duplicate test coverage"
          print(f"All {len(names)} tests covered once.")
          PY_VERIFY

  linux-rust:
    # Preserve the existing combined required-check name. A cancelled, failed,
    # or skipped prerequisite must never produce a successful Linux gate.
    needs: [linux-quality, linux-app-core-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both Linux signals
        env:
          QUALITY_RESULT: ${{ needs['linux-quality'].result }}
          TEST_RESULT: ${{ needs['linux-app-core-tests'].result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$TEST_RESULT" != "success" ]]; then
            echo "Linux gates incomplete: quality=$QUALITY_RESULT tests=$TEST_RESULT"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: web-frontend
        run: npm ci
      - name: Verify frontend
        working-directory: web-frontend
        run: |
          npx prettier --check "src/**/*.{ts,tsx}"
          npm test
          npm run build
